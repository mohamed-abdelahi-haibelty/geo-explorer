# Build-time-only overlay — layer this on top of docker-compose.yml for the
# initial deploy (and any deploy after a schema change), never for the
# steady-state `up -d`. See the README's production deploy section for the
# exact command sequence.
#
# `db` gets a build-time-only published port: the `app` build (network:
# host) needs Postgres reachable at localhost:5432 for generateStaticParams's
# real Prisma queries, but the committed docker-compose.yml never publishes
# one at runtime.
#
# `tools` builds the Dockerfile's `toolsbase` stage (has `prisma` and `tsx`,
# which the slim `runner` image deliberately doesn't, and stops before
# `next build` so it doesn't need migrations applied yet) — its own buildable
# target so `migrate deploy`, the seed, and scripts/create-admin.ts run via
# `docker compose run --rm tools <cmd>` instead of installing dev tooling
# into the image that actually serves traffic.
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  tools:
    build:
      context: ..
      dockerfile: Dockerfile
      target: toolsbase
      network: host
      args:
        DATABASE_URL: postgresql://${POSTGRES_USER:-geoexplorer}:${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in docker/.env}@localhost:5432/${POSTGRES_DB:-geoexplorer}
    env_file:
      - ../.env
    environment:
      # Overrides whatever DATABASE_URL got baked in as a build ARG above —
      # at `run` time this container is a normal member of the Compose
      # network, not `--network host`, so it reaches Postgres by service
      # name instead of localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-geoexplorer}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-geoexplorer}
    depends_on:
      db:
        condition: service_healthy
